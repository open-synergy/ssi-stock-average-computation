scenarios:
  - name: "Create Stock Average Computation with Operating Unit"
    steps:
      - step: "Create stock average computation type"
        action: "create"
        model: "stock_average_computation_type"
        save_as: "type"
        values:
          name: "Test Stock Average Computation Type OU 1"
          code: "TESTSACTYPEOU1"

      - step: "Create stock_average_computation with operating_unit_id"
        action: "create"
        model: "stock_average_computation"
        save_as: "record"
        values:
          date: "2024-01-01"
          date_end: "2024-01-31 00:00:00"
          type_id: "REC: type.id"
          operating_unit_id: "REF: operating_unit.main_operating_unit"

      - step: "Assert operating_unit_id is set"
        action: "assert"
        target: "record"
        asserts:
          operating_unit_id:
            type: "value"
            operator: "is_truthy"

  - name: "User without operating unit access cannot read or write"
    steps:
      - step: "Create stock average computation type"
        action: "create"
        model: "stock_average_computation_type"
        save_as: "type"
        values:
          name: "Test Stock Average Computation Type OU 2"
          code: "TESTSACTYPEOU2"

      - step: "Create restricted operating unit"
        action: "create"
        model: "operating.unit"
        save_as: "ou_restricted"
        values:
          name: "OU Restricted Test"
          code: "OURESTRICTEDTEST"
          partner_id: "REC: company.partner_id.id"

      - step: "Create user without access to main operating unit"
        action: "create"
        model: "res.users"
        save_as: "restricted_user"
        values:
          name: "Restricted OU User"
          login: "restricted_ou_user@example.com"
          groups_id:
            - - 6
              - 0
              - - "REF: base.group_user"
                - "REF:
                  ssi_stock_average_computation.stock_average_computation_user_group"
                - "REF:
                  ssi_stock_average_computation_operating_unit.stock_average_computation_ou_group"
          assigned_operating_unit_ids:
            - - 6
              - 0
              - - "REC: ou_restricted.id"

      - step: "Create stock_average_computation with main operating unit"
        action: "create"
        model: "stock_average_computation"
        save_as: "record"
        values:
          date: "2024-01-01"
          date_end: "2024-01-31 00:00:00"
          type_id: "REC: type.id"
          operating_unit_id: "REF: operating_unit.main_operating_unit"

      - step: "Restricted user cannot read the record"
        action: "call"
        target: "record"
        method: "read"
        args:
          - - "date"
        as_user: "restricted_user"
        expect_error:
          type: "AccessError"

      - step: "Restricted user cannot write the record"
        action: "write"
        target: "record"
        as_user: "restricted_user"
        expect_error:
          type: "AccessError"
        values:
          date_end: "2024-02-28 00:00:00"
